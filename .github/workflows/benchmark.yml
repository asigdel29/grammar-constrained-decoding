# Record CPU timing samples for a fixed vocabulary and fixed schema set.
name: CPU benchmark
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the benchmark
        run: python -m pip install .
      - name: Record measurements
        working-directory: ${{ runner.temp }}
        run: |
          python -m grammar_decode.benchmark --repeats 7 --iterations 10 --vocab-size 1024 > measurements.json
          python -m pip freeze > packages.txt
          lscpu > cpu.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/measurements.json
            ${{ runner.temp }}/packages.txt
            ${{ runner.temp }}/cpu.txt
          if-no-files-found: error
