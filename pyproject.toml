# Declare the schema compiler and its installation requirements.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grammar-constrained-decoding"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["regex>=2024.5.15"]
license = "Apache-2.0"
readme = "README.md"

[project.optional-dependencies]
pydantic = ["pydantic>=2,<3"]

[tool.setuptools]
packages = ["grammar_decode"]
