# Build the Rust core and the Python adapter together.
[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "grammar-constrained-decoding"
dynamic = ["version"]
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"

[project.optional-dependencies]
pydantic = ["pydantic>=2,<3"]

[tool.maturin]
features = ["python"]
module-name = "grammar_decode._native"
python-source = "python"
locked = true
